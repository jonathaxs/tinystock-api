# Ambiente de desenvolvimento local: banco PostgreSQL e a API.
#
#   docker compose up -d --build   liga tudo (a API aplica as migracoes ao subir)
#   docker compose up -d db        liga so o banco, para rodar a API com npm run dev
#   docker compose down            desliga (os dados continuam no volume)
#   docker compose down -v         desliga e apaga os dados

name: tinystock

services:
  db:
    image: postgres:18-alpine
    # Datas exibidas no horario de Brasilia; no banco continuam guardadas com fuso.
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    environment:
      POSTGRES_USER: tinystock
      POSTGRES_PASSWORD: tinystock
      POSTGRES_DB: tinystock
    ports:
      # So aceita conexoes do proprio Mac.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinystock -d tinystock"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      # Dentro do Docker o banco e encontrado pelo nome do servico (db), nao por localhost.
      DATABASE_URL: postgres://tinystock:tinystock@db:5432/tinystock
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
