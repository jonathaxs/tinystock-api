# Ambiente de desenvolvimento local. Por enquanto so o banco; a API entra na etapa seguinte.
#
#   docker compose up -d      liga o banco em segundo plano
#   docker compose down       desliga (os dados continuam no volume)
#   docker compose down -v    desliga e apaga os dados; na proxima subida recria tudo do zero

name: tinystock

services:
  db:
    image: postgres:18-alpine
    # Datas exibidas no horario de Brasilia; no banco continuam guardadas com fuso.
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    environment:
      POSTGRES_USER: tinystock
      POSTGRES_PASSWORD: tinystock
      POSTGRES_DB: tinystock
    ports:
      # So aceita conexoes do proprio Mac.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      # Rodam em ordem alfabetica so na primeira subida, com o volume vazio.
      - ./db/migrations/001_tabelas_iniciais.sql:/docker-entrypoint-initdb.d/001_tabelas_iniciais.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/900_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinystock -d tinystock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
